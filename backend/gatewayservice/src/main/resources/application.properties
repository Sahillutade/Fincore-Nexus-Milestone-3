spring.application.name=gatewayservice
server.port=8088

# Eureka Discovery Registration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
eureka.instance.hostname=localhost
eureka.instance.instance-id=127.0.0.1:${spring.application.name}:${server.port}

# 1. Customer Service Route
spring.cloud.gateway.routes[0].id=customermicroservice
spring.cloud.gateway.routes[0].uri=lb://CUSTOMERMICROSERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/customer/**

# 2. Account Service Route
spring.cloud.gateway.routes[1].id=accountservice
spring.cloud.gateway.routes[1].uri=lb://ACCOUNTSERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/account/**

# 3. Transaction Service Route
spring.cloud.gateway.routes[2].id=transactionservice
spring.cloud.gateway.routes[2].uri=lb://TRANSACTIONSERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/transactions/**

# 4. Loan Service Route
spring.cloud.gateway.routes[3].id=loanservice
spring.cloud.gateway.routes[3].uri=lb://LOANSERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/loan/**,/loans/**

# Native Gateway Header Deduplication (Prevents duplicate CORS headers from downstream microservices)
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true

# Global CORS Configuration for React (Port 3000)
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:3000
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true

# 5. Payment Service Route
spring.cloud.gateway.routes[4].id=paymentservice
spring.cloud.gateway.routes[4].uri=lb://PAYMENTSERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/payment/**,/payments/**
spring.cloud.gateway.routes[4].predicates[1]=Method=GET,POST,PUT,DELETE,OPTIONS

# 6. Notification Service Route
spring.cloud.gateway.routes[5].id=notificationservice
spring.cloud.gateway.routes[5].uri=lb://NOTIFICATIONSERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/notification/**,/notifications/**
spring.cloud.gateway.routes[5].predicates[1]=Method=GET,POST,PUT,DELETE,OPTIONS
